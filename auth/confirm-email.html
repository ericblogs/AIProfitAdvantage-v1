<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Email Confirmed | AI Profit Advantage</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../style.css">
</head>
<body>
<main class="section">
  <div class="container" style="max-width:720px;">
    <div class="card" style="text-align:center;padding:48px 32px;">
      <div class="brand" style="justify-content:center;margin-bottom:28px;">
        <span class="brand-mark">AI</span>
        <span class="brand-wordmark">AI Profit Advantage</span>
      </div>
      <div id="confirmation-status" role="status" aria-live="polite">
        <div style="font-size:3rem;margin-bottom:12px;">🔐</div>
        <span class="eyebrow">EMAIL CONFIRMATION</span>
        <h1>Confirming Your Account…</h1>
        <p class="lead">Please wait while APEP completes your secure email confirmation.</p>
      </div>
    </div>
  </div>
</main>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
import { SUPABASE_CONFIG } from '../config/supabase-config.js';

const supabase = createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.publishableKey, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
});

const status = document.getElementById('confirmation-status');
const params = new URLSearchParams(window.location.search);
const requestedRedirect = params.get('redirect');
const providerOnboardingPath = '/pages/provider-onboarding.html';
const redirectPath = requestedRedirect === providerOnboardingPath ? providerOnboardingPath : '/dashboard/index.html';
const encodedRedirect = encodeURIComponent(redirectPath);
let handled = false;

function loginUrl() {
  return `login.html?redirect=${encodedRedirect}&next=${encodedRedirect}`;
}

function showError(message) {
  status.innerHTML = `
    <div style="font-size:3rem;margin-bottom:12px;">⚠️</div>
    <span class="eyebrow">CONFIRMATION ISSUE</span>
    <h1>We Could Not Complete Confirmation</h1>
    <p class="lead">${message}</p>
    <a class="button button-primary" href="${loginUrl()}">Go to Login</a>`;
}

async function confirm() {
  if (handled) return;
  handled = true;

  const { data, error } = await supabase.auth.getSession();
  if (error) {
    handled = false;
    showError(error.message || 'Please request a new confirmation link.');
    return;
  }

  if (!data.session) {
    handled = false;
    showError('Your confirmation link may be expired or invalid. Please request a new confirmation email.');
    return;
  }

  status.innerHTML = `
    <div style="font-size:3rem;margin-bottom:12px;">✅</div>
    <span class="eyebrow">EMAIL CONFIRMED</span>
    <h1>Registration Confirmed</h1>
    <p class="lead">Your email has been confirmed successfully. Redirecting you to the APEP login page…</p>`;

  // Email verification must not silently authenticate the account.
  // End the confirmation session and require an explicit login.
  const { error: signOutError } = await supabase.auth.signOut();
  if (signOutError) {
    handled = false;
    showError('Your email was confirmed, but we could not safely finish the sign-in transition. Please go to Login and sign in manually.');
    return;
  }

  setTimeout(() => {
    window.location.replace(loginUrl());
  }, 900);
}

supabase.auth.onAuthStateChange((event, session) => {
  if ((event === 'SIGNED_IN' || event === 'INITIAL_SESSION') && session) confirm();
});

confirm();
</script>
</body>
</html>
