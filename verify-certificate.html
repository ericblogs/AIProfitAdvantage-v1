<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><title>Verify APEP Certificate</title><style>:root{--navy:#07111f;--gold:#d7ad4b;--ink:#142033;--muted:#667085;--line:#e7ebf0;--bg:#f5f7fa}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}main{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(680px,100%);background:#fff;border:1px solid var(--line);border-radius:18px;padding:30px;box-shadow:0 18px 50px rgba(7,17,31,.09)}.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:11px;font-weight:800;color:var(--gold)}h1{font-size:30px;margin:8px 0}.lead{color:var(--muted);line-height:1.6}.form{display:grid;gap:12px;margin-top:22px}label{font-size:11px;font-weight:800;text-transform:uppercase;color:var(--muted)}input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit}.btn{border:0;border-radius:10px;background:var(--navy);color:#fff;padding:12px 16px;font:inherit;font-weight:800;cursor:pointer}.result{margin-top:22px;padding:18px;border-radius:12px;border:1px solid var(--line);display:none}.verified{border-color:#b7dfc9;background:#f1fbf5}.invalid{border-color:#e6b7b7;background:#fff5f5}.row{display:flex;justify-content:space-between;gap:15px;padding:9px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.k{color:var(--muted);font-size:12px}.v{font-weight:700;text-align:right}@media(max-width:520px){.card{padding:22px}.row{display:block}.v{text-align:left;margin-top:3px}}</style></head>
<body><main><section class="card"><div class="eyebrow">AI Profit Advantage Enterprise</div><h1>Certificate Verification</h1><p class="lead">Verify an APEP Academy certificate using the certificate number and its private verification code.</p><form class="form" id="form"><div><label for="number">Certificate Number</label><input id="number" autocomplete="off" required></div><div><label for="code">Verification Code</label><input id="code" autocomplete="off" required></div><button class="btn" type="submit">Verify Certificate</button></form><div class="result" id="result"></div></section></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';import{SUPABASE_CONFIG}from'./config/supabase-config.js';const sb=createClient(SUPABASE_CONFIG.url,SUPABASE_CONFIG.publishableKey);const p=new URLSearchParams(location.search);number.value=p.get('certificate')||'';form.onsubmit=async e=>{e.preventDefault();result.style.display='block';result.className='result';result.textContent='Verifying…';const{data,error}=await sb.rpc('get_public_certificate',{p_certificate_number:number.value.trim(),p_verification_code:code.value.trim()});if(error||!data?.length){result.className='result invalid';result.innerHTML='<strong>Certificate not verified</strong><p>The certificate number and verification code did not produce an authoritative credential record.</p>';return}const c=data[0];const label=c.status==='ISSUED'||c.status==='REISSUED'?'VALID':'NOT CURRENTLY VALID';result.className='result '+(c.status==='ISSUED'||c.status==='REISSUED'?'verified':'invalid');result.innerHTML=`<strong>${label}</strong><div class="row"><span class="k">Certificate</span><span class="v">${esc(c.certificate_number)}</span></div><div class="row"><span class="k">Learner</span><span class="v">${esc(c.student_name)}</span></div><div class="row"><span class="k">Course</span><span class="v">${esc(c.course_title)}</span></div><div class="row"><span class="k">Status</span><span class="v">${esc(c.status)}</span></div><div class="row"><span class="k">Issued</span><span class="v">${new Date(c.issued_at).toLocaleDateString()}</span></div>${c.revoked_at?`<div class="row"><span class="k">Revoked</span><span class="v">${new Date(c.revoked_at).toLocaleDateString()}</span></div>`:''}`};function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]) )}</script></body></html>
