<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>APEP Admin — Providers</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f5f7fa;color:#142033}main{width:min(100%,1400px);margin:32px auto;padding:0 20px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:20px}.top h1{margin:8px 0 4px;font-size:clamp(24px,3vw,34px)}.top a{color:#163d73;text-decoration:none}.panel{background:#fff;border:1px solid #e2e7ef;border-radius:16px;padding:20px;box-shadow:0 8px 28px rgba(20,32,51,.06)}.notice{padding:12px 14px;border-radius:10px;background:#eef4fb;margin-bottom:16px}.error{background:#fff0f0;color:#8a1f1f}.meta{color:#657286;font-size:14px}.toolbar{display:flex;gap:10px;align-items:center;margin:14px 0;flex-wrap:wrap}.toolbar input{flex:1 1 280px;min-width:0}button{border:0;border-radius:9px;padding:10px 14px;background:#163d73;color:#fff;cursor:pointer}input{width:100%;padding:10px 12px;border:1px solid #ccd5e2;border-radius:9px}table{width:100%;border-collapse:collapse;table-layout:auto}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid #edf0f4;font-size:13px;vertical-align:top;overflow-wrap:anywhere}th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#657286}.status{font-weight:700;text-transform:capitalize}.empty{text-align:center;padding:30px;color:#657286}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2f7;font-size:12px;font-weight:700}.id{font-size:11px;word-break:break-all}
@media(max-width:1199px){main{margin:20px auto;padding:0 14px}.panel{padding:16px}table,thead,tbody,tr,td{display:block;width:100%}thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}tbody{display:grid;gap:12px}tr{background:#fff;border:1px solid #e2e7ef;border-radius:12px;padding:12px}td{display:grid;grid-template-columns:minmax(120px,38%) 1fr;gap:10px;border:0;padding:7px 0;font-size:14px}td::before{content:attr(data-label);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#657286}td:first-child{padding-top:0}td:last-child{padding-bottom:0}.top{flex-direction:column}.top nav{width:100%}}
@media(max-width:560px){main{padding:0 10px;margin:12px auto}.panel{padding:12px;border-radius:12px}.toolbar{display:grid;grid-template-columns:1fr auto}.toolbar input{grid-column:1/-1}.toolbar span{grid-column:1/-1}.top h1{font-size:25px}td{grid-template-columns:1fr;gap:3px}td::before{margin-bottom:1px}}
</style>
</head>
<body><main>
<div class="top"><div><strong>APEP ADMINISTRATION</strong><h1>Provider Management</h1><div class="meta">Authoritative provider records — administrative read surface</div></div><nav><a href="./index.html">Command Center</a> · <a href="./courses.html">Courses</a></nav></div>
<section class="panel">
<div id="notice" class="notice">Authenticating administrator…</div>
<div class="toolbar" id="toolbar" hidden><input id="search" type="search" placeholder="Search provider, business, location, service, or status"><button id="refresh" type="button">Refresh</button><span id="count" class="meta"></span></div>
<div id="tableWrap" class="meta">Loading provider records…</div>
</section></main>
<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
import{SUPABASE_CONFIG}from'../config/supabase-config.js';
const supabase=createClient(SUPABASE_CONFIG.url,SUPABASE_CONFIG.publishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const notice=document.getElementById('notice'),wrap=document.getElementById('tableWrap'),toolbar=document.getElementById('toolbar'),search=document.getElementById('search'),count=document.getElementById('count');let rows=[];
function fail(message){notice.className='notice error';notice.textContent=message;wrap.textContent='';toolbar.hidden=true}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function cell(label,value,cls=''){return `<td data-label="${esc(label)}" class="${cls}">${value}</td>`}
function render(){const q=search.value.trim().toLowerCase();const filtered=rows.filter(r=>[r.display_name,r.business_name,r.service_area,r.state,r.city,r.lga,r.verification_status,r.professional_verification_status,r.services,r.availability_status,r.provider_id].some(v=>String(v??'').toLowerCase().includes(q)));count.textContent=`${filtered.length} of ${rows.length} provider${rows.length===1?'':'s'}`;if(!filtered.length){wrap.innerHTML='<div class="empty">No provider records match the current search.</div>';return}wrap.innerHTML=`<table><thead><tr><th>Provider</th><th>Business</th><th>Location</th><th>Services</th><th>Verification</th><th>Professional verification</th><th>Availability</th><th>Active</th><th>Rating</th><th>Jobs</th><th>Response</th><th>Updated</th><th>Provider ID</th></tr></thead><tbody>${filtered.map(r=>`<tr>${cell('Provider',`<strong>${esc(r.display_name||'—')}</strong><br><span class="meta">${esc(r.phone||'—')}</span>`)}${cell('Business',esc(r.business_name||'—'))}${cell('Location',esc([r.city,r.state,r.lga,r.service_area].filter(Boolean).join(', ')||'—'))}${cell('Services',esc(r.services||'—'))}${cell('Verification',`<span class="pill">${esc(r.verification_status||'—')}</span>`)}${cell('Professional verification',`<span class="pill">${esc(r.professional_verification_status||'—')}</span>`)}${cell('Availability',esc(r.availability_status||'—'))}${cell('Active',r.is_active?'Yes':'No')}${cell('Rating',`${esc(r.rating_average)} (${esc(r.rating_count)})`)}${cell('Jobs',esc(r.completed_jobs))}${cell('Response',r.response_rate==null?'—':esc(r.response_rate))}${cell('Updated',r.updated_at?new Date(r.updated_at).toLocaleString():'—')}${cell('Provider ID',esc(r.provider_id),'id')}</tr>`).join('')}</tbody></table>`}
async function load(){wrap.textContent='Loading provider records…';const{data,error}=await supabase.rpc('admin_get_providers');if(error){fail(`Provider data path unavailable: ${error.message}`);return}rows=data||[];notice.className='notice';notice.textContent='Administrator authorized. Provider records are read-only in this gate.';toolbar.hidden=false;render()}
async function init(){const{data:{session},error}=await supabase.auth.getSession();if(error||!session){fail('Administrator authentication required.');return}const{data:isAdmin,error:adminError}=await supabase.rpc('is_current_user_admin');if(adminError||!isAdmin){fail('Access denied. Administrator authorization is required.');return}await load()}
search.addEventListener('input',render);document.getElementById('refresh').addEventListener('click',load);init();
</script></body></html>
