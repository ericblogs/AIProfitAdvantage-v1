<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>APEP Admin — Enrollments</title>
<style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f5f7fa;color:#142033}main{max-width:1200px;margin:40px auto;padding:0 24px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}.top a{color:#163d73;text-decoration:none}.panel{background:#fff;border:1px solid #e2e7ef;border-radius:16px;padding:22px;box-shadow:0 8px 28px rgba(20,32,51,.06)}.notice{padding:12px 14px;border-radius:10px;background:#eef4fb;margin-bottom:18px}.error{background:#fff0f0;color:#8a1f1f}.meta{color:#657286;font-size:14px}.toolbar{display:flex;gap:10px;align-items:center;margin:16px 0;flex-wrap:wrap}button{border:0;border-radius:9px;padding:10px 14px;background:#163d73;color:#fff;cursor:pointer}input{padding:10px 12px;border:1px solid #ccd5e2;border-radius:9px;min-width:260px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid #edf0f4;font-size:14px}th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#657286}.status{font-weight:700;text-transform:capitalize}.empty{text-align:center;padding:30px;color:#657286}@media(max-width:800px){main{margin:20px auto}.panel{overflow:auto}.top{align-items:flex-start;flex-direction:column}table{min-width:850px}}</style>
</head>
<body><main>
<div class="top"><div><strong>APEP ADMINISTRATION</strong><h1>Enrollment Management</h1><div class="meta">Authoritative enrollment records — administrative read surface</div></div><nav><a href="./index.html">Command Center</a> · <a href="./courses.html">Courses</a></nav></div>
<section class="panel">
<div id="notice" class="notice">Authenticating administrator…</div>
<div class="toolbar" id="toolbar" hidden><input id="search" type="search" placeholder="Search student, email, or course"><button id="refresh" type="button">Refresh</button><span id="count" class="meta"></span></div>
<div id="tableWrap" class="meta">Loading enrollment records…</div>
</section></main>
<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
import{SUPABASE_CONFIG}from'../config/supabase-config.js';
const supabase=createClient(SUPABASE_CONFIG.url,SUPABASE_CONFIG.publishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const notice=document.getElementById('notice'),wrap=document.getElementById('tableWrap'),toolbar=document.getElementById('toolbar'),search=document.getElementById('search'),count=document.getElementById('count');
let rows=[];
function fail(message){notice.className='notice error';notice.textContent=message;wrap.textContent='';toolbar.hidden=true;}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function render(){const q=search.value.trim().toLowerCase();const filtered=rows.filter(r=>[r.student_name,r.student_email,r.course_title,r.status,r.user_id,r.enrollment_id].some(v=>String(v??'').toLowerCase().includes(q)));count.textContent=`${filtered.length} of ${rows.length} enrollment${rows.length===1?'':'s'}`;if(!filtered.length){wrap.innerHTML='<div class="empty">No enrollment records match the current search.</div>';return;}wrap.innerHTML=`<table><thead><tr><th>Student</th><th>Email</th><th>Course</th><th>Status</th><th>Enrolled</th><th>Completed</th><th>Enrollment ID</th></tr></thead><tbody>${filtered.map(r=>`<tr><td>${esc(r.student_name||'—')}</td><td>${esc(r.student_email||'—')}</td><td>${esc(r.course_title||'—')}</td><td class="status">${esc(r.status)}</td><td>${r.enrolled_at?new Date(r.enrolled_at).toLocaleString():'—'}</td><td>${r.completed_at?new Date(r.completed_at).toLocaleString():'—'}</td><td class="meta">${esc(r.enrollment_id)}</td></tr>`).join('')}</tbody></table>`;}
async function load(){wrap.textContent='Loading enrollment records…';const{data,error}=await supabase.rpc('admin_get_enrollments');if(error){fail(`Enrollment data path unavailable: ${error.message}`);return;}rows=data||[];notice.className='notice';notice.textContent='Administrator authorized. Enrollment records are read-only in this gate.';toolbar.hidden=false;render();}
async function init(){const{data:{session},error}=await supabase.auth.getSession();if(error||!session){fail('Administrator authentication required.');return;}const{data:isAdmin,error:adminError}=await supabase.rpc('is_current_user_admin');if(adminError||!isAdmin){fail('Access denied. Administrator authorization is required.');return;}await load();}
search.addEventListener('input',render);document.getElementById('refresh').addEventListener('click',load);init();
</script></body></html>
