<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Course 06 Learner Resources | APEP Academy</title><link rel="stylesheet" href="../style.css"><style>body{font-family:Arial,sans-serif;margin:0;background:#0b1220;color:#eef2f7}.wrap{max-width:1100px;margin:auto;padding:36px}.hero,.lesson{background:#111827;border:1px solid #263244;border-radius:16px;padding:24px;margin-bottom:18px}.hero{border-top:4px solid #f4c542}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.box{background:#172033;border-radius:12px;padding:18px}.box li,.box p{line-height:1.6;color:#cbd5e1}.links a{display:block;padding:8px;color:#f4c542}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="hero"><h1>AI Agents &amp; Intelligent Automation</h1><p>Course 06 • MASTER • Learner Resource Center</p><p>Each lesson has three required professional learner resources: Lesson Notes, AI Prompt Practice Worksheet, and Lesson Quick Reference Guide.</p></section><div id="lessons"></div></main><script>const titles=['What Is an AI Agent?','Agent Architecture & Control Loops','Tools, APIs & Function Calling','Context, Memory & State','Planning & Multi-Step Reasoning','Human-in-the-Loop Agent Design','Agent Workflows & Orchestration','Building a Business Agent','Multi-Agent Systems','Evaluation, Testing & Reliability','Security, Permissions & Guardrails','Observability, Cost & Operations','Enterprise Agent Governance','Designing an Intelligent Automation Program','Capstone — Build the APEP Intelligent Business Agent'];const prompts=['Classify a business task as chatbot, automation or agent and explain why.','Design a bounded agent control loop with explicit stop conditions.','Create safe function specifications for three business tools.','Create a privacy-aware memory policy for an agent.','Turn a business goal into a verified multi-step agent plan.','Create a risk-based approval matrix for an agent.','Separate LLM tasks from deterministic workflow steps.','Generate and critique a professional agent specification.','Design a multi-agent architecture and identify coordination risks.','Create an evaluation set with expected outcomes and failure cases.','Threat-model an agent and produce a risk/control matrix.','Design an agent operations dashboard with KPIs and thresholds.','Draft an enterprise agent governance policy.','Create a 90-day intelligent-automation pilot roadmap.','Review my final agent blueprint for production readiness.'];document.getElementById('lessons').innerHTML=titles.map((t,i)=>`<section class="lesson"><h2>Lesson ${String(i+1).padStart(2,'0')} • ${t}</h2><div class="grid"><article class="box"><h3>📄 Lesson Notes</h3><p><b>Core takeaway:</b> Capture the lesson's key concepts, terminology, principles and decisions.</p><p><b>Study task:</b> Write three insights you can explain without referring to the lesson.</p></article><article class="box"><h3>📝 AI Prompt Practice Worksheet</h3><p><b>Practice prompt:</b> ${prompts[i]}</p><p><b>Your context:</b> __________________________</p><p><b>Your improved prompt:</b> ____________________</p></article><article class="box"><h3>📚 Lesson Quick Reference Guide</h3><ul><li>Define objective and success condition.</li><li>Map inputs, tools and constraints.</li><li>Validate outputs and apply guardrails.</li><li>Measure reliability and business value.</li><li>Escalate consequential actions.</li></ul></article></div></section>`).join('');</script></body></html>
