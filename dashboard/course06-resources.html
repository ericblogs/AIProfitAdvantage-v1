<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Course 06 Learner Resources | APEP Academy</title><link rel="stylesheet" href="../style.css"><style>body{font-family:Arial,sans-serif;margin:0;background:#0b1220;color:#eef2f7}.wrap{max-width:1180px;margin:auto;padding:36px}.hero,.lesson{background:#111827;border:1px solid #263244;border-radius:16px;padding:24px;margin-bottom:20px}.hero{border-top:4px solid #f4c542}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.box{background:#172033;border-radius:12px;padding:18px}.box li,.box p{line-height:1.65;color:#cbd5e1}.box h3{margin-top:0}.tag{display:inline-block;border:1px solid #f4c542;color:#f4c542;border-radius:999px;padding:5px 10px;font-size:.75rem;font-weight:800}.links a{display:block;padding:8px;color:#f4c542}@media(max-width:900px){.grid{grid-template-columns:1fr}}a{color:#f4c542}</style></head><body><main class="wrap"><section class="hero"><span class="tag">06 • MASTER</span><h1>AI Agents &amp; Intelligent Automation</h1><p>Professional learner resource center for all 15 lessons. Every lesson includes lesson-specific notes, prompt practice and an operational quick reference.</p><p><a href="ai-agents-academy.html?lesson=1">← Return to Course Player</a></p></section><div id="lessons"></div></main><script>const data=[
['What Is an AI Agent?','An AI agent is a system that pursues a defined objective using model reasoning, tools, state and controlled actions. Distinguish agents from chatbots and deterministic automation.','Define a customer-support task and classify it as chatbot, automation or agent. Explain the decision using autonomy, tools, state and action criteria.',['Agent = objective + model + tools + state + control.','Autonomy must be bounded by permissions and stop conditions.','Use agents when variable reasoning is valuable.','Prefer deterministic automation for predictable rules.']],
['Agent Architecture & Control Loops','Study the agent loop: perceive context, reason, select an action, execute a tool, observe the result and continue or stop. Architecture should make control explicit.','Design a control loop for an agent that checks an order, consults inventory and proposes an action. Specify two stop conditions.',['Separate planning from execution.','Define maximum iterations and timeouts.','Validate tool outputs before the next step.','Make failure and escalation paths explicit.']],
['Tools, APIs & Function Calling','Tools extend an agent beyond text generation. Good tool contracts define purpose, inputs, outputs, permissions, validation and failure behaviour.','Write specifications for three tools: search customer record, create support ticket and draft refund request. Include required inputs and permission boundaries.',['Use least-privilege tool access.','Validate arguments before execution.','Return structured, predictable results.','Never allow model text to bypass authorization.']],
['Context, Memory & State','Context is information available for the current decision; memory persists selected information; state records workflow position. Each should have a clear lifecycle.','Create a memory policy for a sales agent identifying what may be stored, retention, user consent and deletion requirements.',['Minimize retained data.','Separate transient context from durable memory.','Protect sensitive information.','Make memory editable and auditable where appropriate.']],
['Planning & Multi-Step Reasoning','Complex goals should be decomposed into observable steps with dependencies, validation points and termination criteria. Planning must remain bounded.','Convert “prepare a qualified lead follow-up” into a five-step plan with inputs, tools, validation and a final approval point.',['Break goals into verifiable tasks.','Validate intermediate outputs.','Use explicit dependencies.','Set budgets for time, tokens and tool calls.']],
['Human-in-the-Loop Agent Design','Human oversight is a control mechanism for consequential actions. Approval thresholds should depend on risk, reversibility and business impact.','Create a three-tier approval matrix for an agent handling customer refunds: low, medium and high risk.',['Automate low-risk reversible actions.','Require approval for consequential actions.','Provide humans with context and rationale.','Record approval and execution events.']],
['Agent Workflows & Orchestration','Reliable systems combine probabilistic model steps with deterministic workflow logic. Orchestration controls sequencing, retries, branching and state transitions.','Map a workflow where an agent interprets an email, a deterministic system validates the request, and an approved tool executes the action.',['Keep deterministic rules outside the model.','Use explicit state transitions.','Make retries idempotent.','Design timeout and fallback paths.']],
['Building a Business Agent','A business agent starts with a measurable job-to-be-done, clear users, data sources, tools, permissions and success metrics.','Draft a one-page specification for an APEP business agent that qualifies leads and prepares personalized follow-up drafts.',['Start with a measurable business outcome.','Define user, data and tool boundaries.','Specify success and failure criteria.','Design human escalation before deployment.']],
['Multi-Agent Systems','Multiple specialized agents can divide work but introduce coordination, security and consistency risks. Use multi-agent designs only when specialization creates clear value.','Design three cooperating agents for market research: researcher, analyst and reviewer. Define inputs, outputs and handoffs.',['Give each agent a bounded role.','Use structured handoffs.','Avoid duplicated authority.','Add a coordinator or deterministic orchestration layer where needed.']],
['Evaluation, Testing & Reliability','Agent evaluation requires representative tasks, expected outcomes, safety cases, tool-call checks and regression testing. Reliability must be measured rather than assumed.','Create a 10-case evaluation set for a customer-service agent, including normal, ambiguous, adversarial and tool-failure cases.',['Test task success and safety separately.','Include edge and adversarial cases.','Track regressions after changes.','Use human review for high-impact outcomes.']],
['Security, Permissions & Guardrails','Agent security combines identity, least privilege, input/output validation, tool authorization, secrets protection, prompt-injection defenses and safe failure.','Threat-model an agent that can read CRM records and draft emails. Identify five threats and one control for each.',['Never expose secrets to the model.','Enforce permissions outside model instructions.','Treat retrieved content as untrusted input.','Log security-relevant actions.']],
['Observability, Cost & Operations','Production agents need telemetry for latency, tool failures, token usage, task success, escalations and cost. Operational controls make systems sustainable.','Design an operations dashboard with five KPIs and alert thresholds for an agent handling 1,000 monthly tasks.',['Measure business outcome, not only model metrics.','Track cost per successful task.','Monitor latency and failures.','Set alerts and ownership before launch.']],
['Enterprise Agent Governance','Enterprise governance defines ownership, risk classification, data controls, approval requirements, auditability, change management and retirement criteria.','Draft a governance policy for an internal HR assistant covering data access, approvals, audit logs and prohibited actions.',['Assign accountable owners.','Classify agent risk before deployment.','Document approved data and tools.','Require review for material changes.']],
['Designing an Intelligent Automation Program','An automation program needs portfolio prioritization, process discovery, ROI hypotheses, risk controls, architecture standards, pilots and scale gates.','Build a 90-day pilot roadmap for one high-volume business process. Include baseline, target, milestones, risks and go/no-go criteria.',['Choose measurable high-value processes.','Establish a baseline before automation.','Pilot before scaling.','Use explicit technical and business gates.']],
['Capstone — Build the APEP Intelligent Business Agent','The capstone integrates objective definition, architecture, tools, memory, planning, oversight, evaluation, security, observability and governance into one production-oriented blueprint.','Produce an end-to-end APEP Intelligent Business Agent blueprint. Include architecture, tool contracts, approval matrix, evaluation set, threat model, KPIs and deployment gates.',['Define objective and measurable outcome.','Document architecture and control boundaries.','Include human oversight and security controls.','Specify evaluation, monitoring and rollback.','Present a production readiness decision.']]
];
const root=document.getElementById('lessons');root.innerHTML=data.map((d,i)=>`<section class="lesson" id="lesson-${i+1}"><h2>Lesson ${String(i+1).padStart(2,'0')} • ${d[0]}</h2><div class="grid"><article class="box"><h3>📄 Lesson Notes</h3><p>${d[1]}</p><p><strong>Reflection:</strong> ${d[2]}</p></article><article class="box"><h3>📝 AI Prompt Practice Worksheet</h3><p><strong>Practice prompt:</strong> ${d[2]}</p><p><strong>Your context:</strong> ______________________________</p><p><strong>Your improved prompt:</strong> ________________________</p><p><strong>Expected output / success criteria:</strong> ______________</p></article><article class="box"><h3>📚 Lesson Quick Reference Guide</h3><ul>${d[3].map(x=>`<li>${x}</li>`).join('')}</ul></article></div></section>`).join('');</script></body></html>
