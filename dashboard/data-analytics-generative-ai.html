<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Data Analytics with Generative AI | APEP</title><style>body{font-family:system-ui,sans-serif;max-width:1100px;margin:auto;padding:24px}nav a{display:block;padding:7px;text-decoration:none}.grid{display:grid;grid-template-columns:280px 1fr;gap:24px}@media(max-width:760px){.grid{grid-template-columns:1fr}}aside{border:1px solid #ddd;padding:16px;border-radius:12px}main{min-width:0}</style></head><body><header><h1>Data Analytics with Generative AI</h1><p>Professional 20-lesson program • ₦79,000 NGN</p></header><div class="grid"><aside><h2>Course Outline</h2><nav id="outline"></nav></aside><main id="lesson" aria-live="polite"></main></div><script>const lessons=[['Introduction to Data Analytics with Generative AI','Introduction to Data Analytics with Generative AI'],['Data Analytics Mindset & Career Pathways','Data Analytics Mindset & Career Pathways'],['Data Types, Sources & Data Quality','Data Types, Sources & Data Quality'],['Statistics for Practical Data Analysis','Statistics for Practical Data Analysis'],['Excel for Data Cleaning','Excel for Data Cleaning'],['Excel Formulas, Functions & Lookups','Excel Formulas, Functions & Lookups'],['Excel PivotTables & Analytical Reporting','Excel PivotTables & Analytical Reporting'],['Power BI Fundamentals','Power BI Fundamentals'],['Data Modeling & Relationships in Power BI','Data Modeling & Relationships in Power BI'],['Power BI Dashboards & Visualization','Power BI Dashboards & Visualization'],['Generative AI + Power BI Analysis','Generative AI + Power BI Analysis'],['SQL Fundamentals for Analysts','SQL Fundamentals for Analysts'],['SQL Queries, Joins & Aggregations','SQL Queries, Joins & Aggregations'],['Tableau Fundamentals & Visualization','Tableau Fundamentals & Visualization'],['ChatGPT for Data Analysis','ChatGPT for Data Analysis'],['Claude for Data Analysis & Research','Claude for Data Analysis & Research'],['Gamma for Data Storytelling & Presentations','Gamma for Data Storytelling & Presentations'],['Building a Professional Data Analytics Project','Building a Professional Data Analytics Project'],['LinkedIn + CV Optimization for Data Analysts','LinkedIn + CV Optimization for Data Analysts'],['Capstone — Build a Job-Ready Data Analytics Portfolio','Capstone — Build a Job-Ready Data Analytics Portfolio']];const outline=document.getElementById('outline');lessons.forEach((x,i)=>{const a=document.createElement('a');a.href='?lesson='+(i+1);a.textContent=String(i+1).padStart(2,'0')+' — '+x[0];outline.appendChild(a)});const n=Math.max(1,Math.min(20,Number(new URLSearchParams(location.search).get('lesson')||1)));fetch('course07-lesson-'+String(n).padStart(2,'0')+'.html').then(r=>{if(!r.ok)throw Error('Lesson unavailable: '+r.status);return r.text()}).then(t=>document.getElementById('lesson').innerHTML=t).catch(e=>document.getElementById('lesson').innerHTML='<p role="alert">Unable to load lesson. '+e.message+'</p>');</script></body></html>
