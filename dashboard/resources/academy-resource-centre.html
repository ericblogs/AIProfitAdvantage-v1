<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>APEP Academy Resource Centre</title><link rel="stylesheet" href="../../style.css"><link rel="stylesheet" href="../dashboard.css"></head><body><main class="dashboard-main"><header class="dashboard-header"><h1>📚 APEP Academy Resource Centre</h1><p>Study Notes • AI Prompt Practice • Quick Reference</p></header><section class="lesson-content"><p>Select a lesson to access its resource pack. Each pack is designed to support <strong>Study → Practise → Remember</strong>.</p><div id="resources"></div></section></main><script type="module">const m=location.search.match(/[?&]lesson=(\d+)/);const n=m?Number(m[1]):null;const titles={4:'Neural Networks & Deep Learning',5:'Data: The Fuel of AI',6:'Natural Language Processing',7:'Computer Vision & Multimodal AI',8:'Generative AI & Foundation Models',9:'Large Language Models & AI Assistants',10:'Prompt Engineering Fundamentals',11:'Prompt Patterns for Professional Work',12:'AI Tools & Choosing the Right Model',13:'AI Safety, Ethics, Privacy & Responsible Use',14:'AI Evaluation & Quality Control',15:'AI Workflow Thinking',16:'AI Automation Fundamentals',17:'AI for Marketing & Content Operations',18:'AI for Sales & Customer Experience',19:'AI for Operations, Research & Decision Support',20:'Enterprise AI Strategy & Your Next Stage'};const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));const box=document.querySelector('#resources');if(n&&titles[n]){box.innerHTML=`<h2>Lesson ${n} — ${esc(titles[n])}</h2><p><strong>Lesson Notes:</strong> Review the core concepts, definitions, examples and APEP business applications from this lesson.</p><p><strong>AI Prompt Practice Worksheet:</strong> Recreate the lesson prompt, improve it with your own context and document what changed.</p><p><strong>Quick Reference Guide:</strong> Remember the lesson's framework, key terminology, quality checks and enterprise application principle.</p><button onclick="window.print()">🖨 Print / Save as PDF</button>`}else{box.innerHTML='<h2>Lessons 4–20</h2>'+Object.entries(titles).map(([k,v])=>`<p><a href="?lesson=${k}">Lesson ${k} — ${esc(v)}</a></p>`).join('')}</script></body></html>
