<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>APEP Academy Resource Centre</title><link rel="stylesheet" href="../../style.css"><link rel="stylesheet" href="../dashboard.css"><style>
:root{--apep-navy:#0b2b5b;--apep-blue:#08b7dc;--apep-gold:#d6a323}body{background:#f5f8fc}.resource-shell{max-width:1050px;margin:0 auto;padding:28px}.brand{background:#fff;border-bottom:4px solid var(--apep-gold);padding:20px 24px;margin-bottom:20px;border-radius:14px;box-shadow:0 8px 24px rgba(11,43,91,.08)}.brand img{width:210px;max-width:65%;height:auto;display:block}.brand h1{color:var(--apep-navy);margin:12px 0 4px;font-size:28px}.brand p{margin:0;color:#526176}.student-box,.resource-card{background:#fff;border:1px solid #dbe5f0;border-radius:14px;padding:22px;margin:16px 0;box-shadow:0 5px 18px rgba(11,43,91,.06)}.student-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{border-bottom:1px solid #9aa9bb;padding:10px 4px}.resource-card h2{color:var(--apep-navy);margin-top:0}.resource-card h3{color:#123d79;margin-top:24px}.resource-card li{margin:7px 0;line-height:1.55}.resource-card p{line-height:1.65}.prompt{background:#eef8fc;border-left:5px solid var(--apep-blue);padding:16px;border-radius:8px;white-space:pre-wrap}.worksheet-line{border-bottom:1px solid #9aa9bb;min-height:28px;margin:8px 0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.actions button,.actions a{border:0;border-radius:9px;padding:11px 16px;font-weight:700;text-decoration:none;cursor:pointer}.primary{background:var(--apep-navy);color:#fff}.secondary{background:#e7f6fa;color:var(--apep-navy)}.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.quick-item{border-left:4px solid var(--apep-gold);background:#f9fbfd;padding:14px;border-radius:8px}.notice{background:#fff8e6;border-left:4px solid var(--apep-gold);padding:14px;border-radius:8px}.index-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}.index-grid a{background:#fff;padding:16px;border-radius:10px;border:1px solid #dbe5f0;text-decoration:none;color:var(--apep-navy);font-weight:700}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button{background:#edf3f8;border:1px solid #ccd8e5;padding:10px 14px;border-radius:8px;cursor:pointer;font-weight:700}.tabs button.active{background:var(--apep-navy);color:#fff}.resource-view{display:none}.resource-view.active{display:block}@media(max-width:650px){.resource-shell{padding:14px}.student-grid{grid-template-columns:1fr}.brand img{width:170px}.brand h1{font-size:23px}}@media print{body{background:#fff}.resource-shell{max-width:none;padding:0}.brand,.student-box,.resource-card{box-shadow:none}.actions,.tabs{display:none!important}.resource-view{display:none!important}.resource-view.printing{display:block!important}.resource-card{break-inside:avoid}.brand{border-bottom:2px solid #000}}
</style></head><body><main class="resource-shell"><section class="brand"><img src="../../assets/images/logo-header.png" alt="AI Profit Advantage Enterprise Platform"><h1>APEP Academy — Resource Centre</h1><p>AI Foundations • Study → Practise → Remember</p></section><div id="app"></div></main><script type="module">
const n=Number((location.search.match(/[?&]lesson=(\d+)/)||[])[1]);const group=n<=7?1:n<=11?2:n<=15?3:n<=19?4:5;const e=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));const app=document.querySelector('#app');
if(!Number.isInteger(n)||n<4||n>20){const mods=[];for(let g=1;g<=5;g++)mods.push(await import(`../../js/academy-lessons-${g}.js`));const all=Object.assign({},...mods.map(m=>m.L));app.innerHTML='<section class="student-box"><h2>Lessons 4–20</h2><p>Select a lesson to open its complete APEP resource pack.</p><div class="index-grid">'+Object.entries(all).map(([k,d])=>`<a href="?lesson=${k}">Lesson ${k} — ${e(d.title)}<br><small>Notes • Prompt Practice • Quick Reference</small></a>`).join('')+'</div></section>';}
else{const mod=await import(`../../js/academy-lessons-${group}.js`);const d=mod.L[n];const sectionHtml=d.sections.map(s=>`<h3>${e(s[0])}</h3><p>${e(s[1])}</p>`).join('');const q=d.sections.find(s=>s[0].toLowerCase().includes('knowledge check'))?.[1]||'Review the lesson objectives and explain the central concept in your own words.';const reflection=d.sections.find(s=>s[0].toLowerCase()==='reflection')?.[1]||'Describe one responsible way you could apply this lesson.';const challenge=d.sections.find(s=>s[0].toLowerCase()==='lesson challenge')?.[1]||d.exercise;const key=d.sections.slice(0,5).map(s=>s[0]);app.innerHTML=`<section class="student-box"><div class="student-grid"><div class="field"><strong>Student Name:</strong> __________________________</div><div class="field"><strong>Date:</strong> __________________</div><div class="field"><strong>Course:</strong> APEP Academy — AI Foundations</div><div class="field"><strong>Lesson:</strong> ${n} — ${e(d.title)}</div></div></section><div class="tabs"><button class="active" data-tab="notes">📘 Lesson Notes</button><button data-tab="worksheet">📝 AI Prompt Practice Worksheet</button><button data-tab="quick">📚 Quick Reference Guide</button></div><section id="notes" class="resource-view active resource-card"><h2>📘 Lesson Notes — Lesson ${n}</h2><p><strong>Purpose:</strong> ${e(d.intro)}</p><h3>Learning Objectives</h3><ul>${d.objectives.map(x=>`<li>✅ ${e(x)}</li>`).join('')}</ul>${sectionHtml}<div class="notice"><strong>APEP professional principle:</strong> Connect AI to a real problem, define the process, identify the task, select the capability, design the workflow, establish human oversight and measure the outcome.</div></section><section id="worksheet" class="resource-view resource-card"><h2>📝 AI Prompt Practice Worksheet — Lesson ${n}</h2><h3>Activity 1 — Concept Builder</h3><p>In your own words, explain the central concept of this lesson and give one real-world example.</p><div class="worksheet-line"></div><div class="worksheet-line"></div><h3>Activity 2 — Prompt Engineering Practice</h3><p>Start with the APEP practice prompt below. Improve it by adding audience, context, constraints, source material and output format where useful.</p><div class="prompt">${e(d.prompt)}</div><p><strong>Your improved prompt:</strong></p><div class="worksheet-line"></div><div class="worksheet-line"></div><div class="worksheet-line"></div><h3>Activity 3 — Knowledge Check</h3><p>${e(q)}</p><div class="worksheet-line"></div><div class="worksheet-line"></div><h3>Activity 4 — Real-World AI Reflection</h3><p>${e(reflection)}</p><div class="worksheet-line"></div><div class="worksheet-line"></div><h3>Activity 5 — Entrepreneurial Application</h3><p>Choose a small business or organisation you understand. Do not assume AI should replace the person doing the work; focus on assistance and measurable value.</p><p><strong>Business/process:</strong></p><div class="worksheet-line"></div><p><strong>Current problem:</strong></p><div class="worksheet-line"></div><p><strong>Possible AI assistance:</strong></p><div class="worksheet-line"></div><p><strong>Human check needed:</strong></p><div class="worksheet-line"></div><p><strong>Success metric:</strong></p><div class="worksheet-line"></div><h3>Activity 6 — Lesson Completion Challenge</h3><p>${e(challenge)}</p><div class="worksheet-line"></div><div class="worksheet-line"></div><h3>Final Reflection</h3><p>The most useful idea I learned from this lesson is:</p><div class="worksheet-line"></div><div class="worksheet-line"></div></section><section id="quick" class="resource-view resource-card"><h2>📚 Lesson ${n} — Quick Reference Guide</h2><p><strong>Lesson:</strong> ${e(d.title)}</p><h3>Remember These Objectives</h3><ul>${d.objectives.map(x=>`<li>${e(x)}</li>`).join('')}</ul><h3>Core Concepts</h3><div class="quick">${key.map(x=>`<div class="quick-item"><strong>${e(x)}</strong></div>`).join('')}</div><h3>APEP Workflow Framework</h3><p><strong>Problem → Process → Task → AI Capability → Workflow → Automation → Human Oversight → Outcome</strong></p><h3>Quality Rule</h3><p>Define success criteria, test representative cases, verify important outputs and document uncertainty or failure conditions.</p><h3>Responsible-Use Reminder</h3><p>Minimise unnecessary data, protect sensitive information, respect organisational policy and retain accountable human oversight where risk requires it.</p><h3>Professional Mindset</h3><p>Use AI to create measurable improvement—not simply to add technology. Evaluate value, feasibility and risk before automating.</p></section><div class="actions"><button class="primary" id="printCurrent">🖨 Print / Save Current Resource as PDF</button><a class="secondary" href="../lesson-${n}.html">← Return to Lesson ${n}</a><a class="secondary" href="?lesson=${n<20?n+1:4}">Next Resource →</a></div>`;document.querySelectorAll('.tabs button').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));document.querySelectorAll('.resource-view').forEach(v=>v.classList.remove('active'));btn.classList.add('active');document.getElementById(btn.dataset.tab).classList.add('active')}));document.getElementById('printCurrent').addEventListener('click',()=>{const active=document.querySelector('.resource-view.active');document.querySelectorAll('.resource-view').forEach(v=>v.classList.remove('printing'));active.classList.add('printing');window.print();setTimeout(()=>active.classList.remove('printing'),500)});}
</script></body></html>
