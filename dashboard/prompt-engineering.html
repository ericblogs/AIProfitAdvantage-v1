body{background:#f7f9fc}.player-layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px}.lesson-shell{background:#fff;border-radius:16px;padding:30px;box-shadow:0 8px 28px rgba(0,0,0,.06)}.lesson-meta{display:flex;gap:14px;flex-wrap:wrap;margin:14px 0;color:#64748b}.lesson-section{margin-top:24px;padding:22px;border-radius:12px;background:#f8fafc;border:1px solid #e2e8f0}.prompt-box{padding:16px;background:#eef6ff;border-left:4px solid #d4a017;border-radius:8px;white-space:pre-wrap}.resource-item{display:block;padding:14px 16px;margin:10px 0;background:#0b2348;color:#fff;border:2px solid #d4a017;border-radius:10px;text-decoration:none;font-weight:700}.brand-bar{display:flex;align-items:center;gap:12px;padding:12px 16px;background:#0b2348;color:#fff;border-radius:10px;margin-bottom:20px}.brand-mark{font-weight:900;color:#d4a017}.course-outline{background:#fff;padding:20px;border-radius:16px;height:max-content;position:sticky;top:20px}.course-outline li{margin:7px 0}.course-outline a{color:inherit;text-decoration:none}.lesson-controls{display:flex;justify-content:space-between;margin-top:28px}@media(max-width:900px){.player-layout{grid-template-columns:1fr}.course-outline{position:static}}
</style>

<body><div class="dashboard-layout"><aside class="dashboard-sidebar"><h2>AI Profit Advantage</h2><nav><a href="index.html">🏠 Dashboard</a><a href="courses.html">📚 Courses</a><a href="#" class="active">▶ Course Player</a><a href="certifications.html">🎓 Certifications</a><a href="community.html">💬 Community</a><a href="downloads.html">📁 Downloads</a><a href="#">⚙ Settings</a><a href="../index.html">← Return Website</a></nav></aside><main class="dashboard-main"><header class="dashboard-header"><div><h1>Prompt Engineering</h1><p>Premium Prompt Engineering Academy • APEP</p></div></header><section class="player-layout"><div class="lesson-shell" id="app"></div><aside class="course-outline"><h3>18-Lesson Curriculum</h3><ol id="outline"></ol></aside></section></main></div>
<script>
const lessons=[
['Introduction to Prompt Engineering','Understand prompt engineering as the disciplined design of instructions, context, constraints and evaluation criteria for AI systems.','Define the role of a prompt engineer; distinguish casual prompting from repeatable prompt design; identify business outcomes that prompts should improve.'],
['How AI Understands Effective Prompts','Understand how language models interpret instructions, context, examples and output requirements.','Explain instruction hierarchy; identify ambiguity; improve prompt grounding; recognize why clear constraints improve consistency.'],
['Prompting Fundamentals','Master the core components of a professional prompt.','Use role, task, context, constraints, examples, output format and quality criteria in a repeatable structure.'],
['The Anatomy of a Great Prompt','Deconstruct high-performing prompts into reusable components.','Audit a prompt for missing context, unclear tasks, weak constraints and absent evaluation criteria.'],
['Clarity and Specificity in Prompts','Write precise prompts that reduce ambiguity and unnecessary model interpretation.','Specify audience, scope, assumptions, definitions, deliverables and acceptance criteria.'],
['Context Engineering','Provide the right information at the right time without overwhelming the model.','Separate relevant context from noise; structure source material; define authoritative information and boundaries.'],
['Role Prompting','Use appropriate roles and expertise framing without relying on superficial personas.','Define capabilities, perspective, standards and responsibilities for specialized outputs.'],
['Instructions and Constraints','Control output behavior with explicit rules and boundaries.','Write positive instructions, exclusions, limits, formats, tone requirements and escalation conditions.'],
['Few-Shot Prompting','Use examples to demonstrate desired behavior and output patterns.','Select representative examples; avoid contradictory examples; design examples that teach structure rather than accidental wording.'],
['Chain-of-Thought Prompting','Understand reasoning-oriented prompting without unnecessarily exposing private reasoning.','Use concise reasoning aids such as checklists, decomposition, verification steps and answer audits.'],
['Output Formatting Techniques','Design outputs that humans and software can reliably consume.','Use tables, headings, JSON-like schemas, fields, validation rules and deterministic formatting requirements.'],
['Advanced Prompt Patterns','Combine prompt components into reusable professional patterns.','Apply decomposition, critique-and-revise, rubric-driven generation, extraction, transformation and routing patterns.'],
['Prompt Optimization Techniques','Systematically improve prompts through testing rather than intuition alone.','Create test cases, compare outputs, isolate variables, refine instructions and document versions.'],
['Domain-Specific Prompting','Adapt prompts to marketing, sales, operations, research and executive workflows.','Translate domain goals into context, terminology, constraints, compliance requirements and measurable outputs.'],
['Prompting for Business Results','Connect prompt quality to measurable business value.','Define baseline, target, workflow impact, human effort, quality measures and ROI indicators.'],
['Prompt Testing and Evaluation','Build an evaluation process for accuracy, relevance, consistency, safety and usefulness.','Create rubrics, edge cases, failure categories, human review procedures and regression tests.'],
['Prompt Libraries and Templates','Turn successful prompts into governed reusable organizational assets.','Create naming conventions, metadata, version control, ownership, usage guidance and change management.'],
['Capstone Project: Build a Prompt System','Design a complete prompt system for a real business workflow.','Produce a prompt specification, test suite, evaluation rubric, reusable template, deployment guidance and improvement plan.']
];
const q=new URLSearchParams(location.search);let n=Math.max(1,Math.min(lessons.length,parseInt(q.get('lesson')||'1',10)));const [title,obj,detail]=lessons[n-1];
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const resource=q.get('resource');
const prompt=`You are a senior prompt-engineering consultant. Apply “${title}” to a real business workflow. First ask for the objective, audience, source context, constraints, risks, output format and success criteria. Then produce a professional prompt, explain the design choices, create three test cases including one edge case, and define a simple evaluation rubric.`;
function brandedResource(kind){const labels={notes:'Lesson Notes',prompt:'AI Prompt Practice Worksheet',quick:'Lesson Quick Reference Guide'};let content='';if(kind==='notes')content=`<h2>Lesson Notes — ${esc(title)}</h2><p><strong>Objective:</strong> ${esc(obj)}</p><div class="lesson-section"><h3>Core Notes</h3><p>${esc(detail)}</p><p>Professional prompt engineering is an iterative design discipline. Start with the business result, supply only authoritative context, make the task observable, constrain the output, and define how quality will be judged. A prompt becomes a reusable asset when another practitioner can understand its purpose, run it consistently, evaluate the result and improve the next version.</p><h3>Application</h3><p>Document one workflow from your own organization and identify the prompt inputs, expected output, failure conditions and human review point.</p><h3>Reflection</h3><p>What would make this prompt reliably useful to someone other than you?</p></div>`;if(kind==='prompt')content=`<h2>AI Prompt Practice Worksheet — ${esc(title)}</h2><p>APEP branded practice sheet.</p><div class="lesson-section"><h3>Practice Prompt</h3><div class="prompt-box">${esc(prompt)}</div><h3>Fill In</h3><p>Business objective: ______________________________</p><p>Audience/user: _________________________________</p><p>Authoritative context: ___________________________</p><p>Constraints: ____________________________________</p><p>Required output: _________________________________</p><p>Quality criteria: _________________________________</p><p>Edge case to test: _______________________________</p></div>`;if(kind==='quick')content=`<h2>Quick Reference Guide — ${esc(title)}</h2><div class="lesson-section"><ul><li>Define the outcome before drafting the prompt.</li><li>Give the model relevant, authoritative context.</li><li>State constraints and output requirements explicitly.</li><li>Use examples when they clarify the desired pattern.</li><li>Test normal and edge-case inputs.</li><li>Evaluate outputs against a defined rubric.</li><li>Version and document prompts that become reusable assets.</li></ul></div>`;document.getElementById('app').innerHTML=`<div class="brand-bar"><span class="brand-mark">APEP</span><span>AI PROFIT ADVANTAGE ENTERPRISE PLATFORM</span></div>${content}<p><button class="button button-primary" onclick="window.print()">🖨 Print / Save as PDF</button> <a class="button button-secondary" href="?lesson=${n}">← Back to Lesson</a></p>`}
if(resource&&['notes','prompt','quick'].includes(resource)){brandedResource(resource)}else{document.getElementById('app').innerHTML=`<div class="brand-bar"><span class="brand-mark">APEP</span><span>AI PROFIT ADVANTAGE ENTERPRISE PLATFORM • PREMIUM COURSE</span></div><div class="lesson-meta"><span>📚 Lesson ${n} of 18</span><span>🎯 Intermediate</span><span>🔒 PAID</span><span>⏱ 30–40 Minutes</span></div><h2>Lesson ${n} — ${esc(title)}</h2><section class="lesson-section"><h3>🎯 Learning Objectives</h3><ul><li>${esc(obj)}</li><li>Apply the concept to a real workflow.</li><li>Evaluate the quality and reliability of the resulting prompt.</li></ul></section><section class="lesson-section"><h3>📘 Core Lesson</h3><p>${esc(detail)}</p><p>Begin with the outcome rather than the tool. A professional prompt tells an AI system what must be accomplished, who the output serves, what information is authoritative, what boundaries apply and what a successful answer looks like. When a prompt is vague, the model must infer missing requirements; when a prompt is explicit, the model has a narrower and more testable operating space.</p><p>Use a structured prompt specification: <strong>Role/Capability → Objective → Context → Instructions → Constraints → Output Format → Quality Criteria → Verification</strong>. Not every prompt needs every component, but each component should have a reason to exist. Remove irrelevant context and resolve conflicting instructions before production use.</p><p>Professional practice is empirical. Build a small test set that represents common inputs, difficult inputs and an edge case. Compare outputs against a rubric for accuracy, relevance, completeness, consistency and safety. Revise one variable at a time when possible, document the version and keep a regression set so improvements do not silently break earlier use cases.</p></section><section class="lesson-section"><h3>💼 Real-World Application</h3><p>A marketing, sales or operations team turns an informal AI request into a governed prompt template. The team defines the business outcome, supplies approved context, constrains the response, tests representative cases, obtains human approval for consequential actions and records the prompt version. This turns prompting from personal experimentation into a repeatable capability.</p></section><section class="lesson-section"><h3>🧠 Socratic Check</h3><ol><li>What requirement is currently left for the AI to guess?</li><li>Which context is authoritative and which context is unnecessary?</li><li>How would you know that the output is good enough?</li><li>What edge case could expose a weakness in this prompt?</li></ol></section><section class="lesson-section"><h3>🛠️ Practical Exercise</h3><p>Take one prompt you already use. Rewrite it using the APEP structure. Create three test cases, define a five-point quality rubric, run the prompt, record weaknesses and produce version 2.</p></section><section class="lesson-section"><h3>🧠 AI Prompt Practice</h3><div class="prompt-box">${esc(prompt)}</div></section><section class="lesson-section"><h3>✅ Key Takeaways</h3><ul><li>Prompt quality begins with a defined business outcome.</li><li>Context should be relevant, authoritative and bounded.</li><li>Constraints and output specifications reduce ambiguity.</li><li>Testing and evaluation turn prompting into an engineering discipline.</li><li>Reusable prompts need versioning, ownership and documentation.</li></ul></section><section class="lesson-section"><h3>❓ Knowledge Check</h3><p><strong>Which practice best improves prompt reliability?</strong></p><label><input type="radio" name="q" value="wrong"> Make the prompt as long as possible.</label><br><label><input type="radio" name="q" value="correct"> Define the outcome, context, constraints, output criteria and test cases.</label><br><label><input type="radio" name="q" value="wrong"> Avoid evaluation because AI output is probabilistic.</label><p><button class="button button-primary" onclick="check()">Check Answer</button></p><p id="feedback"></p></section><section class="lesson-section"><h3>📥 APEP Lesson Resources</h3><a class="resource-item" href="?lesson=${n}&resource=notes">📄 APEP Lesson Notes</a><a class="resource-item" href="?lesson=${n}&resource=prompt">📝 APEP AI Prompt Practice Worksheet</a><a class="resource-item" href="?lesson=${n}&resource=quick">📚 APEP Lesson Quick Reference Guide</a></section><div class="lesson-controls">${n>1?`<a class="button button-secondary" href="?lesson=${n-1}">← Previous Lesson</a>`:'<span></span>'}${n<18?`<a class="button button-primary" href="?lesson=${n+1}">Next Lesson →</a>`:'<span></span>'}</div>`;window.check=()=>{const s=document.querySelector('input[name=q]:checked');document.getElementById('feedback').textContent=!s?'⚠️ Select an answer.':s.value==='correct'?'✅ Correct. Reliability comes from explicit design plus evaluation.':'❌ Review the prompt-design principles and try again.'}}
lessons.forEach((x,i)=>document.getElementById('outline').insertAdjacentHTML('beforeend',`<li><a href="?lesson=${i+1}\">${i+1}. ${esc(x[0])}</a></li>`));
</script><script type="module" src="../script.js"></script><script type="module" src="../js/academy-progress-production.js"></script></body></html>
